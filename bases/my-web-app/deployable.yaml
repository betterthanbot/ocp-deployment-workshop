    app.kubernetes.io/name: betterthanbot
    app.kubernetes.io/version: 1.0.0
    helm.sh/chart: betterthanbot-0.0.1
  name: my-web-app-betterthanbot
  namespace: my-web-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/instance: my-web-app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: betterthanbot
    app.kubernetes.io/version: 1.0.0
    helm.sh/chart: betterthanbot-0.0.1
  name: my-web-app-betterthanbot
  namespace: my-web-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- kind: ServiceAccount
  name: my-web-app-betterthanbot
  namespace: my-web-app
---
apiVersion: v1
data:
  APP_ENV: production
  LOG_LEVEL: info
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: my-web-app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: betterthanbot
    app.kubernetes.io/version: 1.0.0
    helm.sh/chart: betterthanbot-0.0.1
  name: my-web-app-betterthanbot-config
  namespace: my-web-app
---
apiVersion: v1
data:
  index.html: |
    <!DOCTYPE html>
    <html>
      <head><title>my-web-app-betterthanbot</title></head>
      <body>
        <h1>my-web-app-betterthanbot</h1>
        <p>Application deployed successfully. Replace this page with your content.</p>
      </body>
    </html>
  servername.conf: |
    ServerName my-web-app-betterthanbot
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: my-web-app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: betterthanbot
    app.kubernetes.io/version: 1.0.0
    helm.sh/chart: betterthanbot-0.0.1
  name: my-web-app-betterthanbot-www
  namespace: my-web-app
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: my-web-app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: betterthanbot
    app.kubernetes.io/version: 1.0.0
    helm.sh/chart: betterthanbot-0.0.1
  name: my-web-app-betterthanbot
  namespace: my-web-app
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/instance: my-web-app
    app.kubernetes.io/name: betterthanbot
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/instance: my-web-app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: betterthanbot
    app.kubernetes.io/version: 1.0.0
    helm.sh/chart: betterthanbot-0.0.1
  name: my-web-app-betterthanbot-app
  namespace: my-web-app
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeMode: Filesystem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: my-web-app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: betterthanbot
    app.kubernetes.io/version: 1.0.0
    helm.sh/chart: betterthanbot-0.0.1
  name: my-web-app-betterthanbot
  namespace: my-web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: my-web-app
      app.kubernetes.io/name: betterthanbot
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: my-web-app
        app.kubernetes.io/name: betterthanbot
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: my-web-app-betterthanbot-config
        image: registry.access.redhat.com/ubi9/httpd-24@sha256:38d71a4cf177f39a2bbe745183009943dbbf404de02aa5f879694aa024a4e6ac
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        name: betterthanbot
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /var/www/html
          name: app-data
        - mountPath: /var/www/html/index.html
          name: www-defaults
          subPath: index.html
        - mountPath: /etc/httpd/conf.d/servername.conf
          name: www-defaults
          subPath: servername.conf
      securityContext:
        runAsNonRoot: true
      serviceAccountName: my-web-app-betterthanbot
      volumes:
      - name: app-data
        persistentVolumeClaim:
          claimName: my-web-app-betterthanbot-app
      - configMap:
          name: my-web-app-betterthanbot-www
        name: www-defaults
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  labels:
    app.kubernetes.io/instance: my-web-app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: betterthanbot
    app.kubernetes.io/version: 1.0.0
    helm.sh/chart: betterthanbot-0.0.1
  name: my-web-app-betterthanbot
  namespace: my-web-app
spec:
  port:
    targetPort: http
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: my-web-app-betterthanbot
    weight: 100
