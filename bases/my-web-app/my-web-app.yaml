# Source: betterthanbot-redhat/templates/db-statefulset.yaml
# ============================================================
# Database StatefulSet
# Deploys an in-cluster PostgreSQL or MySQL instance.
# Both images are Red Hat UBI-based and OCP SCC-compliant.
#
# StatefulSet vs Deployment:
#   StatefulSet gives the DB a stable pod identity and manages
#   ordered pod creation/deletion — important for single-node
#   DB bootstrapping and data integrity.
# ============================================================
---
# Source: betterthanbot-redhat/templates/secret.yaml
# ============================================================
# Secret — Database credentials
# Created whenever a DB engine is configured (in-cluster or
# external). Values are base64-encoded by Helm automatically
# when using the `secret` kind with string data.
#
# PRODUCTION NOTE: Do not commit real passwords to Git.
# Supply the password at deploy time:
#   helm upgrade --install my-webapp . \
#     --set database.credentials.password=<value>
# Or use Sealed Secrets / Vault Agent Injector.
# ============================================================
---
