# Source: betterthanbot-redhat/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-web-app-betterthanbot-redhat
  labels:
    helm.sh/chart: betterthanbot-redhat-0.0.1
    app.kubernetes.io/name: betterthanbot-redhat
    app.kubernetes.io/instance: my-web-app
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: betterthanbot-redhat
      app.kubernetes.io/instance: my-web-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: betterthanbot-redhat
        app.kubernetes.io/instance: my-web-app
    spec:
      serviceAccountName: my-web-app-betterthanbot-redhat

      # -------------------------------------------------------
      # OCP restricted-v2 SCC compliance (OCP 4.11+)
      # runAsNonRoot is enforced at the pod level; the container
      # securityContext below mirrors this for defense-in-depth.
      # -------------------------------------------------------
      securityContext:
        runAsNonRoot: true

      containers:
        - name: betterthanbot-redhat
          image: "registry.access.redhat.com/ubi9/httpd-24:latest"
          imagePullPolicy: IfNotPresent

          # Container-level SCC hardening
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # Required for HPA utilisation calculation
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi

          # -------------------------------------------------------
          # App ConfigMap env vars
          # -------------------------------------------------------
          envFrom:
            - configMapRef:
                name: my-web-app-betterthanbot-redhat-config

          # -------------------------------------------------------
          # Database connection env vars (injected from Secret)
          # -------------------------------------------------------

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          volumeMounts:
            - name: app-data
              # UBI9 httpd-24 document root
              mountPath: /var/www/html
            # Default index.html — prevents 403 on empty PVC at first boot.
            # Once real content exists on the PVC this file is shadowed.
            - name: www-defaults
              mountPath: /var/www/html/index.html
              subPath: index.html
            # Suppress AH00558 ServerName warning
            - name: www-defaults
              mountPath: /etc/httpd/conf.d/servername.conf
              subPath: servername.conf

      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: my-web-app-betterthanbot-redhat-app
        - name: www-defaults
          configMap:
            name: my-web-app-betterthanbot-redhat-www
