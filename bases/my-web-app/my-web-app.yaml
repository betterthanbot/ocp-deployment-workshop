# Source: betterthanbot-redhat/templates/configmap.yaml
# ============================================================
# ConfigMap — Default web content + httpd server config
#
# index.html: Placeholder page served until real content is
#   deployed to the PVC. Prevents the httpd 403 that kills
#   liveness/readiness probes on a fresh empty PVC.
#
# servername.conf: Suppresses the AH00558 ServerName warning
#   by explicitly setting ServerName to the pod's release name.
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-web-app-betterthanbot-redhat-www
  labels:
    helm.sh/chart: betterthanbot-redhat-0.0.1
    app.kubernetes.io/name: betterthanbot-redhat
    app.kubernetes.io/instance: my-web-app
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
  namespace: default
data:
  index.html: |
    <!DOCTYPE html>
    <html>
      <head><title>my-web-app-betterthanbot-redhat</title></head>
      <body>
        <h1>my-web-app-betterthanbot-redhat</h1>
        <p>Application deployed successfully. Replace this page with your content.</p>
      </body>
    </html>
  servername.conf: |
    ServerName my-web-app-betterthanbot-redhat
