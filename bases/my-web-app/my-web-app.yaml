apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: my-web-app-betterthanbot-redhat
  labels:
    helm.sh/chart: betterthanbot-redhat-0.0.1
    app.kubernetes.io/name: betterthanbot-redhat
