# -----------------------------------------------
# Global
# -----------------------------------------------
global:
  partOf: workshop

namespace: "userx-sit"

# -----------------------------------------------
# Frontend  (parksmap)
# -----------------------------------------------
frontend:
  replicaCount: 2

  image:
    repository: docker.io/iogk/parksmap
    tag: "1.0-sit"
    pullPolicy: IfNotPresent

  port: 8080

  resources:
    requests:
      cpu: 50m
      memory: 800Mi
    limits:
      cpu: 200m
      memory: 1Gi

  route:
    enabled: true
    host: ""
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: "Redirect"

# -----------------------------------------------
# Backend  (nationalparks)
# -----------------------------------------------
backend:
  replicaCount: 2

  image:
    repository: quay.io/openshift-roadshow/nationalparks
    tag: "1.3.0"
    pullPolicy: IfNotPresent

  port: 8080

  appName: "National Parks (SIT)"

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi

  route:
    enabled: true
    host: ""
    tls:
      termination: edge
      insecureEdgeTerminationPolicy: Redirect

  healthPath: /ws/healthz/

  extraPorts:
    - containerPort: 8443
    - containerPort: 8778

# -----------------------------------------------
# Database  (MongoDB)
# -----------------------------------------------
database:
  replicaCount: 1

  image:
    repository: quay.io/centos7/mongodb-60-centos7
    tag: "6.0.4"
    pullPolicy: IfNotPresent

  port: 27017

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  dbName: parksapp
  host: mongodb

  credentials:
    adminUser: admin
    adminPassword: secret
    appUser: parksapp
    appPassword: keepsafe

  persistence:
    enabled: false
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi

# -----------------------------------------------
# RBAC
# -----------------------------------------------
rolebinding:
  enabled: true
