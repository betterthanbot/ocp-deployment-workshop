{{- if .Values.rolebinding.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: view
  namespace: {{ include "parksmap.namespace" . }}
  labels:
    {{- include "parksmap.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ include "parksmap.namespace" . }}
{{- end }}
