# Source: parksmap/templates/backend-deploy.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nationalparks
  namespace: user1-sit
  labels:
    helm.sh/chart: "parksmap-0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: workshop
    app: nationalparks
    app.kubernetes.io/name: nationalparks
    app.kubernetes.io/instance: nationalparks
    app.kubernetes.io/component: nationalparks
    role: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nationalparks
      deployment: nationalparks
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: nationalparks
        deployment: nationalparks
    spec:
      containers:
        - name: nationalparks
          image: quay.io/rhn-support-gong/nationalparks:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 8443
              protocol: TCP
            - containerPort: 8778
              protocol: TCP
          env:
            - name: APPNAME
              value: "National Parks (SIT)"
            - name: MONGODB_SERVER_HOST
              value: "mongodb"
            - name: MONGODB_DATABASE
              value: "parksapp"
            - name: MONGODB_USER
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: app-usr
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: app-pwd
          livenessProbe:
            httpGet:
              path: /ws/healthz/
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /ws/healthz/
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 1
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
