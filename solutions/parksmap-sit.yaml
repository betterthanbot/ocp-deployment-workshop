# Source: parksmap/templates/database-deploy.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: user1-sit
  labels:
    helm.sh/chart: "parksmap-0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: workshop
    app: mongodb
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/instance: mongodb
    app.kubernetes.io/component: mongodb
    role: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
      deployment: mongodb
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: mongodb
        deployment: mongodb
    spec:
      containers:
        - name: mongodb
          image: quay.io/rhn-support-gong/mongodb:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
              protocol: TCP
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: admin-usr
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: admin-pwd
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: mongodb-configdb
              mountPath: /data/configdb
            - name: mongodb-data
              mountPath: /data/db
      volumes:
        - name: mongodb-configdb
          emptyDir: {}
        - name: mongodb-data
          emptyDir: {}
