version: "3.8"

# ----------------------------------------------------------
# ParksMap application stack for Docker Compose
#
# This is how the same application runs on a VM.
# Your task is to understand how each section here
# maps to the Helm chart you built in Parts 1 and 2.
# ----------------------------------------------------------

services:

  mongodb:
    image: quay.io/centos7/mongodb-60-centos7:6.0.4
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    ports:
      - "27017:27017"
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  nationalparks:
    image: quay.io/openshift-roadshow/nationalparks:latest
    container_name: nationalparks
    environment:
      MONGODB_SERVER_HOST: mongodb
      MONGODB_DATABASE: parksapp
      MONGODB_USER: parksapp
      MONGODB_PASSWORD: keepsafe
      APPNAME: "National Parks"
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ws/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  parksmap:
    image: quay.io/openshift-roadshow/parksmap:latest
    container_name: parksmap
    depends_on:
      - nationalparks
    ports:
      - "8081:8080"
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 512M

volumes:
  mongo-data:
  mongo-config:
