apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: {{ include "parksmap.namespace" . }}
  labels:
    {{- include "parksmap.database.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "parksmap.database.selectorLabels" . | nindent 4 }}
  ports:
    - name: mongodb
      port: {{ .Values.database.port }}
      targetPort: {{ .Values.database.port }}
      protocol: TCP
