apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
  namespace: {{ include "parksmap.namespace" . }}
  labels:
    {{- include "parksmap.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: {{ include "parksmap.databaseinit.image" . }}
          imagePullPolicy: {{ .Values.databaseinit.image.pullPolicy }}
          env:
            - name: MONGODB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: admin-pwd
            - name: MONGODB_USER
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: app-usr
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: app-pwd
            - name: MONGODB_DATABASE
              value: {{ .Values.database.dbName | quote }}
            - name: MONGODB_HOST
              value: {{ .Values.database.host | quote }}
            - name: BACKEND_URL
              value: {{ include "parksmap.backend.url" . | quote }}
          command:
            - /bin/bash
            - -c
            - |
              # 1. Wait for MongoDB to be reachable
              echo "Waiting for MongoDB at $MONGODB_HOST..."
              MONGO_WAIT_ATTEMPTS=0
              MONGO_WAIT_MAX_ATTEMPTS=36
              until mongosh \
                --host "$MONGODB_HOST" \
                --username admin \
                --password "$MONGODB_ADMIN_PASSWORD" \
                --authenticationDatabase admin \
                --eval "db.adminCommand('ping')" \
                --quiet; do
                MONGO_WAIT_ATTEMPTS=$((MONGO_WAIT_ATTEMPTS + 1))
                if [ "$MONGO_WAIT_ATTEMPTS" -ge "$MONGO_WAIT_MAX_ATTEMPTS" ]; then
                  echo "MongoDB still not reachable after $MONGO_WAIT_ATTEMPTS attempts, giving up."
                  exit 1
                fi
                echo "MongoDB not ready, retrying in 5s... (attempt $MONGO_WAIT_ATTEMPTS/$MONGO_WAIT_MAX_ATTEMPTS)"
                sleep 5
              done
              echo "MongoDB is up."

              # 2. Create app user and database
              echo "Creating app user..."
              mongosh \
                --host "$MONGODB_HOST" \
                --username admin \
                --password "$MONGODB_ADMIN_PASSWORD" \
                --authenticationDatabase admin \
                --quiet \
                --eval "
                  db = db.getSiblingDB('$MONGODB_DATABASE');
                  if (db.getUser('$MONGODB_USER') == null) {
                    db.createUser({
                      user: '$MONGODB_USER',
                      pwd:  '$MONGODB_PASSWORD',
                      roles: [
                        { role: 'dbAdmin',    db: '$MONGODB_DATABASE' },
                        { role: 'readWrite',  db: '$MONGODB_DATABASE' }
                      ]
                    });
                    print('User created.');
                  } else {
                    print('User already exists, skipping.');
                  }
                "

              # 3. Trigger data load via internal service
              echo "Loading initial park data..."
              BACKEND_WAIT_ATTEMPTS=0
              BACKEND_WAIT_MAX_ATTEMPTS=36
              until curl -sf "$BACKEND_URL/ws/data/load"; do
                BACKEND_WAIT_ATTEMPTS=$((BACKEND_WAIT_ATTEMPTS + 1))
                if [ "$BACKEND_WAIT_ATTEMPTS" -ge "$BACKEND_WAIT_MAX_ATTEMPTS" ]; then
                  echo "Data load failed — backend never became ready after $BACKEND_WAIT_ATTEMPTS attempts."
                  exit 1
                fi
                echo "Backend not ready, retrying in 5s... (attempt $BACKEND_WAIT_ATTEMPTS/$BACKEND_WAIT_MAX_ATTEMPTS)"
                sleep 5
              done
              echo "Data loaded successfully."