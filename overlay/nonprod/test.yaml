apiVersion: v1
kind: Namespace
metadata:
  name: my-web-app
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/instance: my-web-app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: my-webapp
    app.kubernetes.io/version: 1.0.0
    helm.sh/chart: my-webapp-0.1.0
  name: my-web-app-my-webapp
  namespace: my-web-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/instance: my-web-app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: my-webapp
    app.kubernetes.io/version: 1.0.0
    helm.sh/chart: my-webapp-0.1.0
  name: my-web-app-my-webapp
  namespace: my-web-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- kind: ServiceAccount
  name: my-web-app-my-webapp
  namespace: my-web-app
---
apiVersion: v1
data:
  .dockerconfigjson: <BASE64_ENCODED_DOCKER_CONFIG_JSON>
kind: Secret
metadata:
  name: my-registry-secret
  namespace: default
type: kubernetes.io/dockerconfigjson
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: my-web-app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: my-webapp
    app.kubernetes.io/version: 1.0.0
    helm.sh/chart: my-webapp-0.1.0
  name: my-web-app-my-webapp
  namespace: my-web-app
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/instance: my-web-app
    app.kubernetes.io/name: my-webapp
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/instance: my-web-app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: my-webapp
    app.kubernetes.io/version: 1.0.0
    helm.sh/chart: my-webapp-0.1.0
  name: my-web-app-my-webapp
  namespace: my-web-app
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: my-web-app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: my-webapp
    app.kubernetes.io/version: 1.0.0
    helm.sh/chart: my-webapp-0.1.0
  name: my-web-app-my-webapp
  namespace: my-web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: my-web-app
      app.kubernetes.io/name: my-webapp
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: my-web-app
        app.kubernetes.io/name: my-webapp
    spec:
      containers:
      - image: docker.io/library/nginx:1.25.3
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        name: my-webapp
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 100m
            memory: 150Mi
          requests:
            cpu: 5pm
            memory: 100Mi
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: data
      serviceAccountName: my-web-app-my-webapp
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: my-web-app-my-webapp
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  labels:
    app.kubernetes.io/instance: my-web-app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: my-webapp
    app.kubernetes.io/version: 1.0.0
    helm.sh/chart: my-webapp-0.1.0
  name: my-web-app-my-webapp
  namespace: my-web-app
spec:
  host: my-webapp.example.com
  port:
    targetPort: http
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: my-web-app-my-webapp
    weight: 100
