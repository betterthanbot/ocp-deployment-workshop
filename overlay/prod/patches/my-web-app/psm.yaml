---
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-web-app-betterthanbot-redhat-www # This may be change to match the existing resource in bases/my-web-app/my-web-app.yaml
  namespace: default # This may be change to match the existing resource in bases/my-web-app/my-web-app.yaml---
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
      <title>Challenge Complete!</title>
      <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet"/>
      <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
        :root {
          --red:    #e63946;
          --yellow: #ffd166;
          --teal:   #06d6a0;
          --navy:   #073b4c;
          --white:  #fffdf7;
          --checker:#f8edeb;
        }
    
        body {
          min-height: 100vh;
          background-color: var(--red);
          background-image:
            repeating-linear-gradient(45deg, rgba(0,0,0,.04) 0px, rgba(0,0,0,.04) 20px, transparent 20px, transparent 40px),
            repeating-linear-gradient(-45deg, rgba(0,0,0,.04) 0px, rgba(0,0,0,.04) 20px, transparent 20px, transparent 40px);
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: 'Nunito', sans-serif;
          padding: 40px 16px;
        }
    
        /* ── Floating food emoji ── */
        .floaters {
          position: fixed;
          inset: 0;
          pointer-events: none;
          overflow: hidden;
          z-index: 0;
        }
        .floater {
          position: absolute;
          font-size: 2rem;
          opacity: .18;
          animation: floatUp linear infinite;
        }
        @keyframes floatUp {
          from { transform: translateY(110vh) rotate(0deg); }
          to   { transform: translateY(-20vh) rotate(360deg); }
        }
    
        /* ── Main card ── */
        .card {
          position: relative;
          z-index: 1;
          background: var(--white);
          border-radius: 20px;
          max-width: 560px;
          width: 100%;
          padding: 48px 48px 40px;
          text-align: center;
          border: 4px solid var(--navy);
          box-shadow: 8px 8px 0px var(--navy);
          animation: pop .6s cubic-bezier(.34,1.56,.64,1) both;
        }
        @keyframes pop {
          from { opacity:0; transform: scale(.8) rotate(-2deg); }
          to   { opacity:1; transform: scale(1) rotate(0deg); }
        }
    
        /* ── Top badge ── */
        .badge {
          display: inline-block;
          background: var(--yellow);
          color: var(--navy);
          font-family: 'Fredoka One', cursive;
          font-size: 13px;
          letter-spacing: .1em;
          text-transform: uppercase;
          padding: 6px 18px;
          border-radius: 20px;
          border: 2px solid var(--navy);
          margin-bottom: 20px;
          box-shadow: 3px 3px 0 var(--navy);
        }
    
        /* ── Food icon ── */
        .food-icon {
          font-size: 80px;
          line-height: 1;
          display: block;
          margin-bottom: 16px;
          animation: wiggle 2s ease-in-out infinite;
        }
        @keyframes wiggle {
          0%,100% { transform: rotate(-5deg) scale(1); }
          50%      { transform: rotate(5deg) scale(1.08); }
        }
    
        /* ── Headline ── */
        h1 {
          font-family: 'Fredoka One', cursive;
          font-size: clamp(2.2rem, 7vw, 3.2rem);
          color: var(--red);
          line-height: 1.05;
          margin-bottom: 4px;
          -webkit-text-stroke: 1.5px var(--navy);
        }
        .sub {
          font-family: 'Fredoka One', cursive;
          font-size: 1.4rem;
          color: var(--navy);
          margin-bottom: 20px;
        }
    
        /* ── Zigzag divider ── */
        .zz {
          width: 100%;
          height: 16px;
          margin: 20px 0;
          background-image: linear-gradient(135deg, var(--teal) 25%, transparent 25%),
            linear-gradient(225deg, var(--teal) 25%, transparent 25%),
            linear-gradient(315deg, var(--teal) 25%, transparent 25%),
            linear-gradient(45deg,  var(--teal) 25%, transparent 25%);
          background-size: 16px 16px;
          background-position: 0 0, 8px 0, 8px -8px, 0 8px;
          border-radius: 2px;
        }
    
        /* ── Body text ── */
        p {
          font-size: 16px;
          color: var(--navy);
          line-height: 1.7;
          font-weight: 600;
        }
    
        /* ── Hooray section ── */
        .hooray {
          display: flex;
          justify-content: center;
          gap: 12px;
          margin: 20px 0;
          flex-wrap: wrap;
        }
        .hooray span {
          background: var(--teal);
          color: var(--navy);
          font-family: 'Fredoka One', cursive;
          font-size: 1rem;
          padding: 8px 18px;
          border-radius: 50px;
          border: 2px solid var(--navy);
          box-shadow: 3px 3px 0 var(--navy);
          animation: bounce 1.4s ease-in-out infinite;
        }
        .hooray span:nth-child(2) { animation-delay: .2s; background: var(--yellow); }
        .hooray span:nth-child(3) { animation-delay: .4s; background: var(--red); color: white; }
        @keyframes bounce {
          0%,100% { transform: translateY(0); }
          50%      { transform: translateY(-6px); }
        }
    
        /* ── Lunch CTA ── */
        .lunch-box {
          margin-top: 24px;
          background: var(--yellow);
          border: 3px solid var(--navy);
          border-radius: 14px;
          box-shadow: 5px 5px 0 var(--navy);
          padding: 18px 24px;
        }
        .lunch-box .label {
          font-family: 'Fredoka One', cursive;
          font-size: 1.6rem;
          color: var(--navy);
        }
        .lunch-box .sublabel {
          font-size: 13px;
          color: #555;
          margin-top: 4px;
          font-weight: 600;
        }
    
        /* ── Footer ── */
        .footer-note {
          margin-top: 24px;
          font-size: 13px;
          color: #999;
          font-weight: 600;
        }
    
        /* ── Stars row ── */
        .stars {
          color: var(--yellow);
          font-size: 20px;
          letter-spacing: 4px;
          margin-top: 8px;
          -webkit-text-stroke: 1px var(--navy);
        }
      </style>
    </head>
    <body>
    
    <!-- Floating food -->
    <div class="floaters" id="floaters"></div>
    
    <div class="card">
      <div class="badge">🎉 Official Result 🎉</div>
    
      <span class="food-icon">🍽️</span>
    
      <h1>Challenge Complete!</h1>
      <div class="sub">You absolutely smashed it.</div>
    
      <p>
        Congratulations — you have <strong>successfully completed the challenge</strong>.<br/>
        Your hard work paid off in the most delicious way possible.
      </p>
    
      <div class="hooray">
        <span>Hip Hip! Hooray!</span>
        <span>Hip Hip! Hooray!</span>
      </div>
    
      <div class="zz"></div>
    
      <div class="lunch-box">
        <div class="label">😋 Now We Wait For Lunch! 😋</div>
        <div class="sublabel">The best reward is a well-earned meal 🥳</div>
      </div>
    
      <div class="stars">★ ★ ★ ★ ★</div>
      <p class="footer-note">You've earned every bit of it — well done! 🌟</p>
    </div>
    
    <script>
      const foods = ['🍕','🍔','🌮','🍜','🍣','🥗','🍩','🧁','🍦','🥪','🍱','🍛'];
      const container = document.getElementById('floaters');
      foods.forEach((emoji, i) => {
        const el = document.createElement('div');
        el.className = 'floater';
        el.textContent = emoji;
        el.style.left = (Math.random() * 95) + '%';
        el.style.animationDuration = (8 + Math.random() * 10) + 's';
        el.style.animationDelay    = (Math.random() * 10) + 's';
        el.style.fontSize = (1.5 + Math.random() * 2) + 'rem';
        container.appendChild(el);
      });
    </script>
    </body>
    </html>