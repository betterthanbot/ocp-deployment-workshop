apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: user1-dev

resources:
  - ../../base

configMapGenerator:
  - name: web-message
    behavior: replace
    literals:
      - APP_ENV=DEV
      - ENV_COLOR=#2563eb
      - APP_MESSAGE=Hello from DEV environment
      - APP_SUBTITLE=Developer workspace overlay applied with Kustomize.
