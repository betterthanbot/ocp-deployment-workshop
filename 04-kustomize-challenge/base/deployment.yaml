apiVersion: apps/v1
kind: Deployment
metadata:
  name: kustom-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kustom-web
  template:
    metadata:
      labels:
        app: kustom-web
    spec:
      containers:
        - name: web
          image: registry.access.redhat.com/ubi9/python-311:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: web-message
          command:
            - /bin/bash
            - -c
            - |
              mkdir -p /tmp/web
              cat > /tmp/web/index.html <<EOF
              <!doctype html>
              <html lang="en">
              <head>
                <meta charset="UTF-8" />
                <meta name="viewport" content="width=device-width, initial-scale=1.0" />
                <title>Kustomize Environment</title>
                <style>
                  :root {
                    --bg: #0f172a;
                    --card: #111827;
                    --text: #e5e7eb;
                    --muted: #9ca3af;
                  }
                  * { box-sizing: border-box; }
                  body {
                    margin: 0;
                    font-family: Inter, Arial, sans-serif;
                    background: radial-gradient(circle at top right, #1f2937, var(--bg));
                    color: var(--text);
                    min-height: 100vh;
                    display: grid;
                    place-items: center;
                  }
                  .card {
                    width: min(860px, 92vw);
                    background: var(--card);
                    border: 1px solid #374151;
                    border-radius: 16px;
                    padding: 28px;
                    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
                  }
                  .badge {
                    display: inline-block;
                    font-size: 12px;
                    letter-spacing: 0.08em;
                    font-weight: 700;
                    text-transform: uppercase;
                    color: white;
                    background: ${ENV_COLOR};
                    padding: 8px 12px;
                    border-radius: 999px;
                  }
                  h1 {
                    margin: 16px 0 10px;
                    font-size: clamp(1.5rem, 3vw, 2rem);
                  }
                  p {
                    margin: 0;
                    color: var(--muted);
                    line-height: 1.6;
                  }
                  code {
                    background: #1f2937;
                    color: #93c5fd;
                    border: 1px solid #374151;
                    padding: 2px 8px;
                    border-radius: 8px;
                  }
                  .panel {
                    margin-top: 20px;
                    border: 1px dashed #4b5563;
                    border-radius: 12px;
                    padding: 16px;
                  }
                </style>
              </head>
              <body>
                <div class="card">
                  <span class="badge">${APP_ENV} OVERLAY</span>
                  <h1>${APP_MESSAGE}</h1>
                  <p>${APP_SUBTITLE}</p>
                  <div class="panel">
                    <p>
                      This page is generated from a Deployment command that reads overlay values from
                      <code>ConfigMap/web-message</code>. Apply a different overlay and refresh this route.
                    </p>
                  </div>
                </div>
              </body>
              </html>
              EOF
              python3 -m http.server 8080 --directory /tmp/web
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
